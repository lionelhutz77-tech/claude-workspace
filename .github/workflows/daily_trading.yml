name: Daily Trading Analysis

on:
  schedule:
    # Taeglich (Krypto handelt auch am Wochenende). Ungerade Minute, weil GitHub
    # Laeufe zur vollen Stunde oft stundenlang verzoegert.
    # 05:23 UTC = 07:23 MESZ / 06:23 MEZ
    - cron: "23 5 * * *"
    # Vorlaeufer-Scanner: montags 05:47 UTC
    - cron: "47 5 * * 1"
  workflow_dispatch:  # Manueller Start per Knopf auf GitHub

permissions:
  contents: write

# Nie zwei Laeufe gleichzeitig: beide wuerden dieselben Datenbanken committen.
concurrency:
  group: trading-system
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: trading-system/requirements.txt

      - name: Abhaengigkeiten installieren
        working-directory: trading-system
        run: pip install -r requirements.txt

      - name: Zugangsdaten pruefen (Telegram + Groq)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
        run: |
          if ! curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getMe" | grep -q '"ok":true'; then
            echo "FEHLER: Telegram-Token ungueltig."; exit 1
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${GROQ_API_KEY}" https://api.groq.com/openai/v1/models)
          if [ "$CODE" != "200" ]; then
            echo "FEHLER: Groq-Key ungueltig (HTTP $CODE). Secret GROQ_API_KEY erneuern."; exit 1
          fi
          echo "Telegram und Groq OK."

      - name: Tagesanalyse ausfuehren
        working-directory: trading-system
        env:
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN:         ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          GMX_EMAIL:              ${{ secrets.GMX_EMAIL }}
          GMX_PASSWORT:           ${{ secrets.GMX_PASSWORT }}
          EMAIL_ABSENDER_FILTER:  ${{ secrets.EMAIL_ABSENDER_FILTER }}
          CI: "true"
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p logs
          set -o pipefail
          python main.py 2>&1 | tee logs/cloud_run.log

      - name: Regel-Strategiearme (Stufe 4)
        working-directory: trading-system
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          python strategie_arme.py 2>&1 | tee logs/strategie_arme.log

      - name: Vorlaeufer-Scanner (nur montags)
        if: github.event.schedule == '47 5 * * 1'
        working-directory: trading-system
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CI: "true"
          PYTHONIOENCODING: utf-8
        run: python forerunner_scan.py

      - name: Marktgedaechtnis committen
        run: |
          git config user.name  "Trading Intelligence Bot"
          git config user.email "bot@trading-intelligence.local"
          git add trading-system/data/
          # Aktuelles Dashboard fuer den PC (cloud_daten_holen.py --oeffnen); output/ ist sonst ignoriert.
          if [ -f trading-system/output/dashboard_aktuell.html ]; then
            git add -f trading-system/output/dashboard_aktuell.html
          fi
          git diff --cached --quiet || git commit -m "Marktgedaechtnis $(date +'%Y-%m-%d')"
          git pull --rebase
          git push

      - name: Qualitaetspruefung (stille Ausfaelle erkennen)
        working-directory: trading-system
        run: |
          # Lauf "erfolgreich", aber KI/Kurse kaputt -> sichtbar machen statt verschweigen.
          PROBLEME=$(grep -cE "Invalid API Key|HTTP 401|model_not_found|\\\$nan|Traceback" logs/cloud_run.log || true)
          echo "Gefundene Problemzeilen: $PROBLEME"
          if [ "$PROBLEME" -gt 0 ]; then
            grep -nE "Invalid API Key|HTTP 401|model_not_found|\\\$nan|Traceback" logs/cloud_run.log | head -20
            exit 1
          fi

      - name: Lauf-Log sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-log-${{ github.run_id }}
          path: |
            trading-system/logs/
            trading-system/output/
          retention-days: 14

      - name: Telegram-Warnung bei Fehler
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Trading-System Cloud-Lauf fehlgeschlagen oder fehlerhaft. Details: ${RUN_URL}" > /dev/null
