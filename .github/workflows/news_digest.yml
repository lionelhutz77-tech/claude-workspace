name: Taeglicher Markt-News-Digest

on:
  schedule:
    # 05:03 UTC = 07:03 MESZ / 06:03 MEZ, vor dem Trading-Lauf (05:23 UTC)
    - cron: "3 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Gleiche Gruppe wie der Trading-Lauf: beide committen trading-system/data/.
concurrency:
  group: trading-system
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: trading-system/requirements.txt

      - name: Abhaengigkeiten installieren
        working-directory: trading-system
        run: pip install -r requirements.txt

      - name: News sammeln, archivieren, zusammenfassen
        working-directory: trading-system
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CI: "true"
          PYTHONIOENCODING: utf-8
        run: python news_digest.py

      - name: Archiv committen
        if: always()
        run: |
          git config user.name  "Trading Intelligence Bot"
          git config user.email "bot@trading-intelligence.local"
          git add trading-system/data/news_archive.db
          if [ -f trading-system/output/news_digest_aktuell.md ]; then
            git add -f trading-system/output/news_digest_aktuell.md
          fi
          git diff --cached --quiet || git commit -m "News-Archiv $(date +'%Y-%m-%d')"
          git pull --rebase
          git push

      - name: Telegram-Warnung bei Fehler
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ News-Digest fehlgeschlagen oder unvollstaendig. Details: ${RUN_URL}" > /dev/null
