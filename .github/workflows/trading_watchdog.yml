name: Trading Cloud-Watchdog

on:
  schedule:
    # Spaeter Tagescheck nach News-Digest und Trading-Analyse.
    # 19:17 UTC = 21:17 MESZ / 20:17 MEZ
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Geprueften Watchdog-Code laden
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github.raw+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/trading-system/scripts/cloud_watchdog.py?ref=${GITHUB_SHA}" \
            --output cloud_watchdog.py

      - name: Cloud-Ablaufe pruefen
        id: health
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python3 cloud_watchdog.py > watchdog.log 2>&1

      - name: Telegram-Warnung bei fehlendem oder defektem Lauf
        if: steps.health.outcome == 'failure'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DETAILS=$(tail -n 12 watchdog.log)
          curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Trading Cloud-Watchdog: Ein Lauf fehlt, hängt oder ist fehlgeschlagen.

          ${DETAILS}

          Details: ${RUN_URL}" > /dev/null

      - name: Watchdog-Ergebnis anzeigen
        if: always()
        run: cat watchdog.log

      - name: Defekten Cloud-Status als Fehler markieren
        if: steps.health.outcome == 'failure'
        run: exit 1
