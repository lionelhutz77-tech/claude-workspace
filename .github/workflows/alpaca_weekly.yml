name: Alpaca Paper-Depot Wochenbericht

on:
  schedule:
    # Sonntag 20:37 UTC = 22:37 MESZ / 21:37 MEZ (ungerade Minute gegen GitHub-Verzoegerung)
    - cron: "37 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install requests python-dotenv

      - name: Paper-Depot-Bericht senden
        working-directory: alpaca-trader
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER:      "true"
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING:  utf-8
        run: |
          if [ -z "$ALPACA_API_KEY" ] || [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "FEHLER: Secrets ALPACA_API_KEY / ALPACA_SECRET_KEY fehlen."; exit 1
          fi
          python portfolio.py --telegram

      - name: Telegram-Warnung bei Fehler
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Alpaca-Wochenbericht fehlgeschlagen. Details: ${RUN_URL}" > /dev/null
